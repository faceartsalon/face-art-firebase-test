<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FACE ART Firebase Test</title>
<style>
:root{color-scheme:dark;--gold:#d9b45e}*{box-sizing:border-box}body{margin:0;background:#0d0c0a;color:#f4f0e8;font:16px/1.5 system-ui;padding:24px}main{max-width:620px;margin:24px auto;background:#1b1b1b;border:1px solid #65532d;border-radius:26px;padding:28px}.tag{border:1px solid #806b3d;border-radius:30px;padding:10px 16px;color:var(--gold)}h1{color:var(--gold);line-height:1.2}p{color:#aaa}button{width:100%;padding:17px;margin:10px 0;border:0;border-radius:13px;font-weight:700;font-size:17px;background:var(--gold);color:#17130b}.secondary{background:#292929;color:#eee;border:1px solid #555}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#111;border:1px solid #444;border-radius:14px;padding:18px;margin-top:18px}.good{color:#9cdb9c}.bad{color:#ffaaa3}input{width:100%;padding:14px;margin:6px 0}</style></head>
<body><main><div class="tag">SAFE TEST · READ ONLY · NO SALON DATA TRANSFER</div><h1>FACE ART Firebase Connection</h1>
<p>Corrected path test. Reads only <b>/face-art/users/{UID}</b>. No salon records are written, edited, or transferred.</p>
<div id="auth">Checking sign-in…</div><button id="read" hidden>Test owner profile read</button><button id="out" class="secondary" hidden>Sign out</button><div id="result">Waiting…</div>
<p>Never share your password or service-account keys.</p></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDDMrc0xLNP9Sq497UTc-ITs-s_88IFh6yM",authDomain:"faceart-6ec98.firebaseapp.com",projectId:"faceart-6ec98",storageBucket:"faceart-6ec98.firebasestorage.app",messagingSenderId:"446197553621",appId:"1:446197553621:web:92a7b8caf8c61891d8c55c"});
const auth=getAuth(app),db=getFirestore(app),authBox=document.getElementById("auth"),result=document.getElementById("result"),readBtn=document.getElementById("read"),outBtn=document.getElementById("out");let currentUser=null;
onAuthStateChanged(auth,user=>{currentUser=user;if(user){authBox.textContent=`Signed in as: ${user.email||"(no email)"}\nUID: ${user.uid}\nProvider: ${user.providerData.map(p=>p.providerId).join(", ")}`;readBtn.hidden=false;outBtn.hidden=false;result.textContent="Signed in. Tap Test owner profile read.";}else{authBox.innerHTML='<input id="email" type="email" placeholder="Owner email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in with email/password</button><button id="google" class="secondary">Sign in with Google</button>';readBtn.hidden=true;outBtn.hidden=true;result.textContent="Sign in with the authorized owner account.";document.getElementById("login").onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("password").value)}catch(e){result.textContent=`SIGN-IN FAILED\n${e.code||""}\n${e.message}`}};document.getElementById("google").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){result.textContent=`GOOGLE SIGN-IN FAILED\n${e.code||""}\n${e.message}`}};}});
readBtn.onclick=async()=>{if(!currentUser)return;result.textContent="Reading owner profile…";try{const ref=doc(db,"face-art","users",currentUser.uid);const snap=await getDoc(ref);if(!snap.exists()){result.textContent=`PROFILE DOCUMENT NOT FOUND\nExpected: /face-art/users/${currentUser.uid}\nNo data changed.`;return;}const d=snap.data();result.textContent=`FIRESTORE READ SUCCESS\nDocument: /face-art/users/${currentUser.uid}\nrole: ${d.role??"(missing)"}\nstatus: ${d.status??"(missing)"}\n\nRead-only test completed. No document changed.`;}catch(e){result.textContent=`FIRESTORE READ FAILED\n${e.code||"unknown-error"}\n${e.message||e}\n\nNo data changed. Do not loosen rules.`;}};
outBtn.onclick=()=>signOut(auth);
</script></body></html>
